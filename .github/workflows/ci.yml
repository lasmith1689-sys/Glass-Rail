name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: GlassRailKit unit tests (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Unit tests
        run: |
          swift test --package-path Packages/GlassRailKit > test.log 2>&1 || status=$?
          grep -E "Executed [0-9]+ tests|error:|failed \(" test.log | sort -u | head -80 || true
          summary=$(grep -E "Executed [0-9]+ tests" test.log | tail -1 | sed 's/^ *//' || true)
          if [ -n "${status:-}" ]; then
            bash .github/scripts/annotate-errors.sh test.log "swift test"
            exit "$status"
          fi
          echo "::notice title=Unit tests::$summary"

      - name: Unit tests in another time zone (results must not depend on the phone's zone)
        run: |
          TZ=Asia/Kolkata swift test --package-path Packages/GlassRailKit > test-tz.log 2>&1 || status=$?
          summary=$(grep -E "Executed [0-9]+ tests" test-tz.log | tail -1 | sed 's/^ *//' || true)
          if [ -n "${status:-}" ]; then
            bash .github/scripts/annotate-errors.sh test-tz.log "swift test (TZ=Asia/Kolkata)"
            exit "$status"
          fi
          echo "::notice title=Unit tests (TZ=Asia/Kolkata)::$summary"

  app:
    name: App + widgets (Simulator build and smoke test)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write # only to force-push screenshots to the ci-screenshots branch
    steps:
      - uses: actions/checkout@v5

      - name: Generate the Xcode project
        run: bash .github/scripts/generate-project.sh

      - name: Pick a simulator
        id: sim
        run: |
          sim=$(.github/scripts/pick-simulator.sh)
          echo "Using simulator: $sim"
          echo "name=${sim%%|*}" >> "$GITHUB_OUTPUT"
          echo "udid=${sim##*|}" >> "$GITHUB_OUTPUT"

      - name: Build app and widget extension
        run: |
          xcodebuild build \
            -project GlassRail.xcodeproj \
            -scheme GlassRail \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          if [ -n "${status:-}" ]; then
            bash .github/scripts/annotate-errors.sh build.log "Simulator build"
            exit "$status"
          fi
          grep -E "warning: " build.log | grep -v "/DerivedData/" | sort -u | head -40 || true
          tail -n 3 build.log

      - name: Verify the widget extension is embedded
        run: |
          app=DerivedData/Build/Products/Debug-iphonesimulator/GlassRail.app
          test -d "$app/PlugIns/GlassRailWidgets.appex"
          plutil -p "$app/Info.plist" | grep -E "CFBundleIdentifier|CFBundleDisplayName|GlassRailAppGroup|UILaunchScreen|ITSAppUsesNonExemptEncryption"
          plutil -p "$app/PlugIns/GlassRailWidgets.appex/Info.plist" | grep -E "CFBundleIdentifier|NSExtensionPointIdentifier|GlassRailAppGroup"

      - name: Smoke test in the Simulator
        timeout-minutes: 20
        run: .github/scripts/smoke-test.sh "${{ steps.sim.outputs.udid }}" DerivedData/Build/Products/Debug-iphonesimulator/GlassRail.app screenshots

      - name: Read screenshots (OCR)
        if: always()
        run: |
          ls screenshots/*.png >/dev/null 2>&1 || exit 0
          swift .github/scripts/ocr.swift screenshots/*.png | tee ocr.txt

      - name: Screen text (1 of 2)
        if: always()
        run: .github/scripts/annotate-screens.sh text ocr.txt 1 8

      - name: Screen text (2 of 2)
        if: always()
        run: .github/scripts/annotate-screens.sh text ocr.txt 9 16

      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls screenshots/*.png >/dev/null 2>&1 || exit 0
          out=$(mktemp -d)
          for file in screenshots/*.png; do
            sips -Z 1100 -s format jpeg -s formatOptions 72 "$file" --out "$out/$(basename "$file" .png).jpg" >/dev/null
          done
          cp ocr.txt "$out/" 2>/dev/null || true
          cd "$out"
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Simulator screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-screenshots
          echo "::notice title=Screenshots::Pushed $(ls *.jpg | wc -l | tr -d ' ') screenshots of ${GITHUB_SHA::7} to the ci-screenshots branch."

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: screenshots
          if-no-files-found: ignore

  archive:
    name: App Store archive (dry run, nothing uploaded)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Archive and check entitlements (no App Store Connect secrets)
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: bash .github/scripts/testflight.sh

  njt-live:
    name: NJ Transit live probe (informational)
    runs-on: macos-26
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Query NJ Transit from the runner
        run: swift run --package-path Packages/GlassRailKit njt-probe njt-probe-out

      - name: Upload raw replies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: njt-live-replies
          path: njt-probe-out
          if-no-files-found: ignore
