# XcodeGen spec. CI runs `xcodegen generate`; the .xcodeproj is not committed.
name: GlassRail
options:
  bundleIdPrefix: com.lasmith1689
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  GlassRailKit:
    path: Packages/GlassRailKit
targets:
  GlassRail:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GlassRail
      - path: Shared
    dependencies:
      - package: GlassRailKit
        product: GlassRailKit
      - target: GlassRailWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: GlassRail
        PRODUCT_BUNDLE_IDENTIFIER: $(GLASSRAIL_APP_BUNDLE_ID)
        INFOPLIST_FILE: Config/GlassRail-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Glass Rail
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: Config/GlassRail.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GlassRailWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GlassRailWidgets
      - path: Shared
    dependencies:
      - package: GlassRailKit
        product: GlassRailKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: GlassRailWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(GLASSRAIL_WIDGET_BUNDLE_ID)
        INFOPLIST_FILE: Config/GlassRailWidgets-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Glass Rail
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: Config/GlassRailWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
schemes:
  GlassRail:
    build:
      targets:
        GlassRail: all
        GlassRailWidgets: all
    run:
      config: Debug
    archive:
      config: Release
